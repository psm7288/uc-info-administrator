user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # TLS는 Tailscale Funnel이 엣지에서 종료하므로 여기선 평문 HTTP로 8443을
    # 듣고, app 컨테이너(도커 컴포즈 서비스명 app)로만 프록시한다.
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;

    server {
        listen 8443;

        client_max_body_size 5m;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        gzip on;
        gzip_types text/css application/javascript application/json;
        gzip_min_length 1024;

        # 공통 프록시 헤더. 클라이언트는 Funnel 통해 https로 붙지만 이
        # nginx는 평문으로 받으므로 X-Forwarded-Proto는 https로 강제한다
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # H2 콘솔/Actuator는 외부에 노출할 이유가 없다
        location ~ ^/(h2-console|actuator) {
            deny all;
            return 404;
        }

        # 로그인/토큰 발급 — 무차별 대입 완화용 rate limit.
        location = /login {
            limit_req zone=login_zone burst=5 nodelay;
            proxy_pass http://app:8081;
        }

        location = /api/auth/verify {
            limit_req zone=login_zone burst=5 nodelay;
            proxy_pass http://app:8081;
        }

        # 모바일 REST API 전체 — 일반 rate limit.
        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://app:8081;
        }

        # 관리자 웹(정적 리소스 포함).
        location / {
            proxy_pass http://app:8081;
        }
    }
}