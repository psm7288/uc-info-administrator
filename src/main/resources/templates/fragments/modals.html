<th:block th:fragment="modals">
    <!-- 공통 백드롭 -->
    <div id="modalBackdrop" class="modal-backdrop hidden"></div>

    <!-- 미리보기: 학생 앱 노출 화면(폰 목업) -->
    <div id="previewModal" class="modal preview-modal hidden" role="dialog" aria-modal="true" aria-labelledby="previewModalTitle">
        <div class="modal-head">
            <h3 id="previewModalTitle">학생 앱 미리보기</h3>
            <button class="modal-close" type="button" aria-label="닫기">×</button>
        </div>
        <div class="modal-body">
            <div class="phone-preview">
                <div class="phone-top">UC Info</div>
                <article>
                    <span>학과 공지</span>
                    <h4>2026학년도 컴퓨터공학과 졸업작품 신청 안내</h4>
                    <p>컴퓨터공학과 3학년 대상 · 신청 기간 05.11 ~ 06.07</p>
                </article>
            </div>
        </div>
        <div class="modal-actions">
            <button class="line-btn" type="button" data-modal-close>닫기</button>
        </div>
    </div>

    <!-- 재발송: 미확인자 푸시 -->
    <div id="resendModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="resendModalTitle">
        <div class="modal-head">
            <h3 id="resendModalTitle">미확인자 재발송</h3>
            <button class="modal-close" type="button" aria-label="닫기">×</button>
        </div>
        <div class="modal-body">
            <div class="modal-summary">
                <strong>119명</strong>
                <p>아직 확인하지 않은 학생에게 푸시 알림을 다시 보냅니다.</p>
            </div>
            <div class="modal-form">
                <label for="resendNotice">대상 공지</label>
                <select id="resendNotice">
                    <option>2026학년도 컴퓨터공학과 졸업작품 신청 안내</option>
                    <option>기말고사 강의실 변경 안내</option>
                </select>

                <label for="resendMessage">알림 메시지</label>
                <textarea id="resendMessage" placeholder="학생에게 표시될 알림 문구를 입력하세요."></textarea>
            </div>
        </div>
        <div class="modal-actions">
            <button class="line-btn" type="button" data-modal-close>취소</button>
            <button class="primary-btn" type="button" data-save="재발송이 완료되었습니다.">재발송</button>
        </div>
    </div>

    <!-- 승인: 검토중 공지 승인 -->
    <div id="approveModal" class="modal small-modal hidden" role="dialog" aria-modal="true" aria-labelledby="approveModalTitle">
        <div class="modal-head">
            <h3 id="approveModalTitle">공지 승인</h3>
            <button class="modal-close" type="button" aria-label="닫기">×</button>
        </div>
        <div class="modal-body">
            <p class="confirm-text">선택한 공지를 승인하여 학생 앱에 게시합니다. 계속하시겠습니까?</p>
        </div>
        <div class="modal-actions">
            <button class="line-btn" type="button" data-modal-close>취소</button>
            <button class="primary-btn" type="button" data-save="공지가 승인되었습니다.">승인</button>
        </div>
    </div>

    <!-- 삭제 확인 -->
    <div id="deleteModal" class="modal small-modal hidden" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
        <div class="modal-head">
            <h3 id="deleteModalTitle">삭제 확인</h3>
            <button class="modal-close" type="button" aria-label="닫기">×</button>
        </div>
        <div class="modal-body">
            <p class="confirm-text">
                정말 삭제하시겠습니까?
                <span class="danger-text">이 작업은 되돌릴 수 없습니다.</span>
            </p>
        </div>
        <div class="modal-actions">
            <button class="line-btn" type="button" data-modal-close>취소</button>
            <button class="danger-btn" type="button" data-save="삭제되었습니다.">삭제</button>
        </div>
    </div>

    <!-- 업무 보기(대시보드 Today Task) -->
    <div id="taskModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
        <div class="modal-head">
            <h3 id="taskModalTitle">오늘의 업무</h3>
            <button class="modal-close" type="button" aria-label="닫기">×</button>
        </div>
        <div class="modal-body">
            <div class="modal-form">
                <p class="confirm-text">검토 대기 2건 · 알림 재발송 1건 · 배너 예약 3건</p>
            </div>
        </div>
        <div class="modal-actions">
            <button class="line-btn" type="button" data-modal-close>닫기</button>
        </div>
    </div>

    <!-- 배너 등록/수정 -->
    <div id="bannerModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="bannerModalTitle">
        <div class="modal-head">
            <h3 id="bannerModalTitle">배너 등록</h3>
            <button class="modal-close" type="button" aria-label="닫기">×</button>
        </div>
        <div class="modal-body">
            <div class="modal-form">
                <label for="bannerTitle">배너 제목</label>
                <input id="bannerTitle" type="text" placeholder="배너에 표시할 제목" />

                <label for="bannerPeriod">노출 기간</label>
                <input id="bannerPeriod" type="text" placeholder="예) 05.11 ~ 06.07" />

                <label for="bannerLink">연결 공지</label>
                <select id="bannerLink">
                    <option>연결 안 함</option>
                    <option>2026학년도 컴퓨터공학과 졸업작품 신청 안내</option>
                </select>
            </div>
        </div>
        <div class="modal-actions">
            <button class="line-btn" type="button" data-modal-close>취소</button>
            <button class="primary-btn" type="button" data-save="배너가 저장되었습니다.">저장</button>
        </div>
    </div>

    <!-- 장학금 등록/수정 -->
    <div id="scholarshipModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="scholarshipModalTitle">
        <div class="modal-head">
            <h3 id="scholarshipModalTitle">장학금 등록</h3>
            <button class="modal-close" type="button" aria-label="닫기">×</button>
        </div>
        <div class="modal-body">
            <div class="modal-form">
                <label for="scholarshipName">장학금명</label>
                <input id="scholarshipName" type="text" placeholder="예) 울산 지역 인재 장학금" />

                <label for="scholarshipType">유형</label>
                <select id="scholarshipType">
                    <option>지역 장학</option>
                    <option>성적 장학</option>
                    <option>교내 장학</option>
                    <option>외부 장학</option>
                </select>

                <label for="scholarshipDeadline">마감일</label>
                <input id="scholarshipDeadline" type="date" />
            </div>
        </div>
        <div class="modal-actions">
            <button class="line-btn" type="button" data-modal-close>취소</button>
            <button class="primary-btn" type="button" data-save="장학금이 저장되었습니다.">저장</button>
        </div>
    </div>

    <!-- 학사 일정 등록/수정 -->
    <div id="scheduleModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="scheduleModalTitle">
        <div class="modal-head">
            <h3 id="scheduleModalTitle">학사 일정 추가</h3>
            <button class="modal-close" type="button" aria-label="닫기">×</button>
        </div>
        <div class="modal-body">
            <div class="modal-form">
                <label for="scheduleTitle">일정명</label>
                <input id="scheduleTitle" type="text" placeholder="예) 기말고사 기간" />

                <label for="scheduleStart">시작일</label>
                <input id="scheduleStart" type="date" />

                <label for="scheduleEnd">종료일</label>
                <input id="scheduleEnd" type="date" />
            </div>
        </div>
        <div class="modal-actions">
            <button class="line-btn" type="button" data-modal-close>취소</button>
            <button class="primary-btn" type="button" data-save="일정이 저장되었습니다.">저장</button>
        </div>
    </div>

    <!-- 관리자 정보 수정 -->
    <div id="accountModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="accountModalTitle">
        <div class="modal-head">
            <h3 id="accountModalTitle">관리자 정보 수정</h3>
            <button class="modal-close" type="button" aria-label="닫기">×</button>
        </div>
        <div class="modal-body">
            <div class="modal-form">
                <label for="accountName">관리자명</label>
                <input id="accountName" type="text" placeholder="관리자 이름" />

                <label for="accountDept">소속 학과/부서</label>
                <input id="accountDept" type="text" placeholder="예) 컴퓨터공학과" />
            </div>
        </div>
        <div class="modal-actions">
            <button class="line-btn" type="button" data-modal-close>취소</button>
            <button class="primary-btn" type="button" data-save="관리자 정보가 저장되었습니다.">저장</button>
        </div>
    </div>

</th:block>
