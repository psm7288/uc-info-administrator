<th:block th:fragment="common(pageTitle)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title th:text="${pageTitle} + ' | UC Info Admin'">UC Info Admin</title>

    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo-favicon.svg}" />
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}" />
    <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap"
            rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/common/reset.css}" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/common/sidebar.css}" />
    <link rel="stylesheet" th:href="@{/css/common/header.css}" />
    <link rel="stylesheet" th:href="@{/css/common/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/common/table.css}" />
    <link rel="stylesheet" th:href="@{/css/common/modal.css}" />
</th:block>

<th:block th:fragment="og(ogTitle, ogDesc, ogUrl)">
    <meta name="description" th:content="${ogDesc}" />
    <link rel="canonical" th:href="${ogUrl}" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UC Info Admin" />
    <meta property="og:title" th:content="${ogTitle}" />
    <meta property="og:description" th:content="${ogDesc}" />
    <meta property="og:url" th:content="${ogUrl}" />
    <meta property="og:image" th:content="@{/images/og_image.png}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" th:content="${ogTitle}" />
    <meta name="twitter:description" th:content="${ogDesc}" />
    <meta name="twitter:image" th:content="@{/images/og_image.png}" />
</th:block>
